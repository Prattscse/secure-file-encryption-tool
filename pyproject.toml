[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-file-encryption-tool"
version = "1.0.0"
description = "A command-line tool for authenticated file encryption and decryption using Fernet."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=42.0,<47.0"]

[project.scripts]
secure-file = "secure_file_crypto.cli:main"

[tool.setuptools.packages.find]
include = ["secure_file_crypto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
